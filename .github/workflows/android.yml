name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -q MeuCatalogoDeCarnes_ProjetoAndroid.zip -d projeto

      - name: Compilar APK
        run: |
          gradle -p projeto/MeuCatalogoCarnesAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Catalogo-de-Carnes-APK
          path: projeto/MeuCatalogoCarnesAndroid/app/build/outputs/apk/debug/app-debug.apk
